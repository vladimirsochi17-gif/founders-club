services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

  app:
    environment:
      NODE_ENV: production
      SERVE_STATIC: "true"
      APP_ORIGIN: ${APP_ORIGIN:?Set public APP_ORIGIN in .env}
      DATABASE_URL: postgres://founders:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/founders_club
      AUTH_HASH_SECRET: ${AUTH_HASH_SECRET:?Set AUTH_HASH_SECRET in .env}
      LOCAL_AUTH_DEV_CODE: ""
      PAYMENTS_MODE: ${PAYMENTS_MODE:-disabled}
      SEED_DEMO: "false"
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM in .env}
      TRUST_PROXY: 1
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
